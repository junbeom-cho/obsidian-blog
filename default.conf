server {
    listen 80;
    
    root /usr/share/nginx/html/public;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n\nSitemap: https://obsidian.junbeom.work/sitemap.xml\n";
    }
}
