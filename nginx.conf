server {
    listen 80;
    server_name localhost;
    
    # 정적 파일들이 위치한 기본 경로
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 핵심 로직: 
        # 1. 원본 URL($uri)을 먼저 찾아보고,
        # 2. 없으면 뒤에 .html을 붙여서($uri.html) 찾아보고,
        # 3. 그래도 없으면 폴더($uri/)로 간주하고,
        # 4. 다 없으면 404 에러 페이지를 띄워라.
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Quartz가 생성한 예쁜 404 페이지와 연동
    error_page 404 /404.html;
}
